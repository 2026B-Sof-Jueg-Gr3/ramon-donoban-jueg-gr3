<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 660" width="880" height="440" font-family="Arial, Helvetica, sans-serif">
  <!-- Controles táctiles al estilo de un emulador (PPSSPP), con las medidas de src/presentacion/ControlesTactiles.js
       en un teléfono apaisado de 1280 x 600 (1 vmin = 6 px). Cada control aprieta la misma tecla que el teclado. -->
  <rect width="1320" height="660" fill="#0d1320"/>
  <rect x="10" y="20" width="1300" height="620" rx="46" fill="#000" stroke="#3c4658" stroke-width="4"/>
  <g transform="translate(20,30)">
    <rect width="1280" height="600" rx="30" fill="#121a2a"/>
    <!-- la escena, de fondo -->
    <circle cx="640" cy="300" r="90" fill="#ffe2a8" opacity="0.12"/>
    <rect x="628" y="270" width="24" height="46" rx="5" fill="#46566e"/>
    <circle cx="640" cy="262" r="12" fill="#e9c6a3"/>

    <!-- MÚSICA y PAUSA en las esquinas de arriba, como gatillos L y R -->
    <rect x="18" y="18" width="120" height="45" rx="3" fill="#000" fill-opacity="0.16" stroke="#e1e1e1" stroke-opacity="0.6" stroke-width="2"/>
    <text x="78" y="47" font-size="19" fill="#ebebeb" text-anchor="middle" letter-spacing="1.5">MÚSICA</text>
    <rect x="1142" y="18" width="120" height="45" rx="3" fill="#000" fill-opacity="0.16" stroke="#e1e1e1" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1202" y="47" font-size="19" fill="#ebebeb" text-anchor="middle" letter-spacing="1.5">PAUSA</text>

    <!-- joystick a la izquierda -->
    <circle cx="132" cy="462" r="102" fill="#000" fill-opacity="0.14" stroke="#e1e1e1" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="132" cy="462" r="54" fill="#1e1e1e" fill-opacity="0.5" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="2"/>

    <!-- botones a la derecha -->
    <circle cx="1187" cy="489" r="57" fill="#000" fill-opacity="0.16" stroke="#e1e1e1" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1187" y="506" font-size="48" fill="#ebebeb" text-anchor="middle">E</text>
    <circle cx="1070" cy="432" r="42" fill="#000" fill-opacity="0.16" stroke="#ffd060" stroke-width="2"/>
    <path d="M 1058 415 h 22 a 3 3 0 0 1 3 3 v 30 h -22 a 3 3 0 0 1 -3 -3 z M 1064 424 h 12 M 1064 430 h 12" fill="none" stroke="#ffd060" stroke-width="2.4"/>
    <circle cx="1187" cy="366" r="42" fill="#000" fill-opacity="0.16" stroke="#e1e1e1" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M 1171 352 h 32 v 22 h -18 l -8 7 v -7 h -6 z M 1179 360 h 16 M 1179 366 h 10" fill="none" stroke="#ebebeb" stroke-width="2.4"/>
  </g>
  <!-- rótulos -->
  <g font-size="20" fill="#ffd060">
    <text x="152" y="350" text-anchor="middle">Joystick: caminar</text>
    <text x="152" y="372" text-anchor="middle" font-size="16" fill="#b9c3cf">(flechas; la linterna sigue el paso)</text>
    <text x="1030" y="545" text-anchor="middle">Libreta (Tab)</text>
    <text x="1030" y="565" text-anchor="middle" font-size="16" fill="#b9c3cf">late cuando se puede resolver</text>
    <text x="1080" y="370" text-anchor="end">Historial (H)</text>
    <text x="1207" y="608" text-anchor="middle">Usar / continuar (E)</text>
    <text x="98" y="122" text-anchor="middle">M</text>
    <text x="1222" y="122" text-anchor="middle">Esc</text>
  </g>
</svg>
