<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 2304 800" width="1152" height="400" font-family="Georgia, 'Times New Roman', serif">
  <!-- Greybox del Nivel 1, El Pasillo Oscuro. Sacado de assets/mapas/nivel1.json: 36 x 13 baldosas de 64 px (coordenadas del mapa). -->
  <rect x="0" y="40" width="2304" height="800" fill="#070d18"/>
  <text x="32" y="96" font-size="40" fill="#ffd060" font-weight="bold">NIVEL 1 · EL PASILLO OSCURO</text>
  <text x="2272" y="96" font-size="28" fill="#b9c3cf" text-anchor="end">greybox a escala · 36 x 13 baldosas de 64 px · vista cenital</text>

  <!-- Suelo -->
  <rect x="64" y="256" width="2176" height="320" fill="#1f2a3d"/>
  <rect x="384" y="576" width="128" height="64" fill="#1f2a3d"/>
  <!-- Paredes -->
  <g fill="#3c4658">
    <rect x="0" y="128" width="2304" height="128"/>
    <rect x="0" y="256" width="64" height="320"/>
    <rect x="2240" y="256" width="64" height="320"/>
    <rect x="0" y="576" width="384" height="64"/>
    <rect x="512" y="576" width="1792" height="64"/>
    <rect x="320" y="640" width="256" height="64"/>
  </g>

  <!-- Ventanas y cortinas en la pared de arriba -->
  <g stroke="#b9c3cf" stroke-width="3" fill="#0b1a33">
    <rect x="480" y="162" width="64" height="76"/>
    <rect x="992" y="162" width="64" height="76"/>
    <rect x="1504" y="162" width="64" height="76"/>
  </g>
  <rect x="1952" y="162" width="64" height="76" fill="#0b1a33" stroke="#e0605a" stroke-width="5" stroke-dasharray="10 6"/>
  <g fill="#7a2a3a">
    <rect x="450" y="150" width="30" height="108"/><rect x="544" y="150" width="30" height="108"/>
    <rect x="962" y="150" width="30" height="108"/><rect x="1056" y="150" width="30" height="108"/>
    <rect x="1474" y="150" width="30" height="108"/><rect x="1568" y="150" width="30" height="108"/>
    <rect x="1922" y="150" width="30" height="108"/><rect x="2016" y="150" width="30" height="108"/>
  </g>
  <text x="1984" y="146" font-size="26" fill="#e0605a" text-anchor="middle">ventana rota</text>
  <text x="1024" y="146" font-size="26" fill="#b9c3cf" text-anchor="middle">cortinas que «caminan» (fenómeno)</text>

  <!-- La corriente: el polvo del haz deriva hacia la ventana rota -->
  <g stroke="#e0605a" stroke-width="4" fill="none" stroke-dasharray="4 14" stroke-linecap="round">
    <path d="M 260 360 C 700 330, 1300 380, 1880 300"/>
  </g>
  <path d="M 1880 300 l -26 -4 l 14 22 z" fill="#e0605a"/>
  <text x="1300" y="420" font-size="26" fill="#e0605a" text-anchor="middle">el polvo del haz deriva hacia el origen de la corriente</text>

  <!-- Muebles (los que tapan la luz llevan borde grueso) -->
  <g fill="#6b7686">
    <rect x="800" y="512" width="128" height="64" stroke="#f4efe4" stroke-width="5"/>
    <rect x="1152" y="272" width="192" height="48"/>
    <rect x="1600" y="536" width="128" height="40"/>
    <rect x="1920" y="384" width="128" height="64" stroke="#f4efe4" stroke-width="5"/>
  </g>
  <g font-size="24" fill="#f4efe4" text-anchor="middle">
    <text x="864" y="500">armario</text>
    <text x="1248" y="366">consola</text>
    <text x="1664" y="526">banco</text>
    <text x="1984" y="476">pila de cajas</text>
    <text x="1984" y="504" fill="#ffd060">(examinar)</text>
  </g>

  <!-- Zona "mirar detrás" de la pila -->
  <rect x="1936" y="256" width="96" height="40" fill="none" stroke="#ffd060" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="1984" y="324" font-size="24" fill="#ffd060" text-anchor="middle">mirar detrás</text>

  <!-- Revelables: solo existen cuando la luz los toca -->
  <g fill="none" stroke="#c89012" stroke-width="4" stroke-dasharray="12 8">
    <rect x="700" y="440" width="96" height="44"/>
    <rect x="1690" y="276" width="190" height="60"/>
  </g>
  <g font-size="24" fill="#c89012" text-anchor="middle">
    <text x="748" y="428">polvo removido</text>
    <text x="1785" y="366">marcas de arrastre</text>
  </g>

  <!-- Pistas y pilas -->
  <g fill="#ffd060" stroke="#070d18" stroke-width="3">
    <circle cx="324" cy="520" r="22"/>
    <circle cx="1252" cy="253" r="22"/>
    <circle cx="448" cy="614" r="22"/>
  </g>
  <g font-size="26" fill="#070d18" text-anchor="middle" font-weight="bold">
    <text x="324" y="529">1</text><text x="1252" y="262">2</text><text x="448" y="623">3</text>
  </g>
  <g font-size="24" fill="#ffd060">
    <text x="354" y="512">huella de bota</text>
    <text x="1282" y="246">recorte (pista clave)</text>
    <text x="478" y="622">pilas</text>
  </g>

  <!-- Inicio -->
  <circle cx="170" cy="440" r="26" fill="#f4efe4"/>
  <path d="M 240 440 l -40 -22 l 0 44 z" fill="#f4efe4" opacity="0.55"/>
  <text x="170" y="410" font-size="26" fill="#f4efe4" text-anchor="middle" font-weight="bold">INICIO</text>

  <!-- Meta -->
  <rect x="1900" y="236" width="300" height="236" fill="none" stroke="#7fd1a8" stroke-width="5" rx="10"/>

  <!-- Leyenda -->
  <g font-size="26">
    <rect x="40" y="732" width="34" height="22" fill="#6b7686" stroke="#f4efe4" stroke-width="4"/>
    <text x="86" y="752" fill="#f4efe4">mueble que tapa la luz</text>
    <rect x="420" y="732" width="34" height="22" fill="none" stroke="#c89012" stroke-width="4" stroke-dasharray="8 5"/>
    <text x="466" y="752" fill="#c89012">revelable (solo con luz)</text>
    <circle cx="820" cy="743" r="14" fill="#ffd060"/>
    <text x="846" y="752" fill="#ffd060">pista / pilas (recoger)</text>
    <path d="M 1170 743 l 60 0" stroke="#e0605a" stroke-width="4" stroke-dasharray="4 10"/>
    <text x="1244" y="752" fill="#e0605a">fenómeno y corriente</text>
    <rect x="1560" y="730" width="40" height="26" fill="none" stroke="#7fd1a8" stroke-width="4" rx="5"/>
    <text x="1612" y="752" fill="#7fd1a8">meta: ventana rota (revelación 2) y deducción</text>
    <text x="40" y="806" fill="#b9c3cf">El inspector aparece a la izquierda y la linterna apunta hacia donde camina. Las pistas se recorren en cualquier orden; el recorte abre la deducción.</text>
  </g>
</svg>
